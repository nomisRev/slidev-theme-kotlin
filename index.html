<!-- Merged into the built page's <head> by Slidev, after its own tags. The
     deck's fonts come from Google Fonts unless the viewer has them installed,
     and the stylesheet request only starts once the page has parsed the link
     Slidev adds: opening the two connections early takes that wait off the
     first paint. -->
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
